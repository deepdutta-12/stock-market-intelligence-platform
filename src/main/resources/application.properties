spring.application.name=stock-market-platform

# Connection parameters
#spring.datasource.url=${jdbc:mysql://localhost:3306/stock_market_platform}
#spring.datasource.username=${DB_USERNAME:root}
#spring.datasource.password=${DB_PASSWORD}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/stock_market_platform}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate/JPA Specific settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true